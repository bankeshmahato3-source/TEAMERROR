<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 250px;
      padding: 16px;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #38bdf8;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h3>Crawler Helper</h3>
  <p id="current-url">Loading...</p>
  <button id="crawl-btn">Crawl This Page</button>

  <script src="popup.js"></script>
</body>
</html>
