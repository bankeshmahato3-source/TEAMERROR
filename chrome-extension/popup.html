<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 250px;
      padding: 16px;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #38bdf8;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #1d4ed8;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>Crawler Helper</h3>
  <p id="current-url">Loading...</p>
  
  <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
    <label style="font-size: 12px; color: #94a3b8;">Hosted Dashboard URL:</label>
    <input type="text" id="dashboard-url" value="http://localhost:5173" placeholder="https://your-hosted-site.com" />
  </div>

  <button id="crawl-btn">Crawl This Page</button>

  <script src="popup.js"></script>
</body>
</html>
